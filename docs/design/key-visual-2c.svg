<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif">
  <title>みんなでつくろう 大富豪 キービジュアル案2C ナイトグランプリ(縦長)</title>

  <defs>
    <linearGradient id="sky2c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17204A"/>
      <stop offset="1" stop-color="#0D1330"/>
    </linearGradient>
    <circle id="star2c" r="3.4"/>
    <path id="sp2c" d="M0,-26 C 5,-19 14,-16 14,-10 C 14,-5 7,-4 3,-7 C 4,-4 5,-1 8,1 L-8,1 C -5,-1 -4,-4 -3,-7 C -7,-4 -14,-5 -14,-10 C -14,-16 -5,-19 0,-26 Z"/>
    <path id="ht2c" d="M0,-21 C -4,-27 -14,-25 -14,-16 C -14,-9 -5,-4 0,1 C 5,-4 14,-9 14,-16 C 14,-25 4,-27 0,-21 Z"/>
    <!-- カードキャラの体(顔つき: 眉+目+笑い) -->
    <g id="char2c">
      <rect x="-50" y="-70" width="100" height="140" rx="12" fill="#FFFFFF" stroke="#171E44" stroke-width="7"/>
      <path d="M-26,-8 L-10,-14" stroke="#171E44" stroke-width="5" stroke-linecap="round"/>
      <path d="M10,-14 L26,-8" stroke="#171E44" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-15" cy="4" r="6" fill="#171E44"/>
      <circle cx="15" cy="4" r="6" fill="#171E44"/>
      <path d="M-16,22 Q 0,40 16,22 Q 8,34 0,34 Q -8,34 -16,22 Z" fill="#171E44"/>
    </g>
  </defs>

  <!-- 夜空 -->
  <rect width="1080" height="1920" fill="url(#sky2c)"/>

  <!-- 星 -->
  <g fill="#FFFFFF" opacity="0.85">
    <use href="#star2c" x="90" y="160"/>
    <use href="#star2c" x="250" y="230"/>
    <use href="#star2c" x="420" y="150"/>
    <use href="#star2c" x="640" y="185"/>
    <use href="#star2c" x="780" y="140"/>
    <use href="#star2c" x="1010" y="170"/>
    <use href="#star2c" x="60" y="420"/>
    <use href="#star2c" x="1020" y="450"/>
    <use href="#star2c" x="80" y="700"/>
    <use href="#star2c" x="1000" y="720"/>
    <use href="#star2c" x="140" y="940"/>
    <use href="#star2c" x="990" y="930"/>
  </g>
  <g stroke="#FFD95C" stroke-width="5" stroke-linecap="round">
    <g transform="translate(120,560)">
      <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
    <g transform="translate(980,590)">
      <line x1="0" y1="-14" x2="0" y2="14"/><line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
  </g>

  <!-- 流れ星 -->
  <g transform="translate(220,200) rotate(20)">
    <line x1="-120" y1="0" x2="-16" y2="0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <polygon points="18,0 6,8 9,22 0,13 -11,19 -8,5 -18,-4 -5,-4 0,-18 5,-5" fill="#FFD95C"/>
  </g>

  <!-- 月 -->
  <circle cx="900" cy="215" r="76" fill="#FFE08A"/>
  <circle cx="874" cy="196" r="14" fill="#F0CE6E"/>
  <circle cx="924" cy="246" r="10" fill="#F0CE6E"/>

  <!-- タイトルロゴ -->
  <text x="540" y="330" font-size="88" font-weight="bold" text-anchor="middle" letter-spacing="8" fill="#FFFFFF" stroke="#0D1330" stroke-width="18" paint-order="stroke" stroke-linejoin="round">みんなでつくろう</text>

  <g font-size="320" font-weight="bold" text-anchor="middle" transform="translate(12,16)" stroke="#0D1330" stroke-width="46" stroke-linejoin="round" fill="#0D1330">
    <text x="216" y="650">大</text>
    <text x="540" y="650">富</text>
    <text x="864" y="650">豪</text>
  </g>
  <g font-size="320" font-weight="bold" text-anchor="middle" stroke="#D63B78" stroke-width="46" stroke-linejoin="round" fill="#D63B78">
    <text x="216" y="650">大</text>
    <text x="540" y="650">富</text>
    <text x="864" y="650">豪</text>
  </g>
  <g font-size="320" font-weight="bold" text-anchor="middle" stroke="#171E44" stroke-width="12" stroke-linejoin="round" paint-order="stroke" fill="#FFCB3D">
    <text x="216" y="650">大</text>
    <text x="540" y="650">富</text>
    <text x="864" y="650">豪</text>
  </g>

  <!-- ネオン看板: キャッチコピー -->
  <g transform="translate(540,810)">
    <rect x="-430" y="-78" width="860" height="156" rx="20" fill="none" stroke="#3EDBB0" stroke-width="20" opacity="0.22"/>
    <rect x="-430" y="-78" width="860" height="156" rx="20" fill="#182052" stroke="#3EDBB0" stroke-width="6"/>
    <g fill="#FFD95C">
      <circle cx="-430" cy="-78" r="7"/><circle cx="-215" cy="-84" r="7"/><circle cx="0" cy="-86" r="7"/><circle cx="215" cy="-84" r="7"/><circle cx="430" cy="-78" r="7"/>
      <circle cx="-430" cy="78" r="7"/><circle cx="-215" cy="84" r="7"/><circle cx="0" cy="86" r="7"/><circle cx="215" cy="84" r="7"/><circle cx="430" cy="78" r="7"/>
    </g>
    <g stroke="#3EDBB0" stroke-width="4" stroke-linecap="round">
      <line x1="-330" y1="-34" x2="-260" y2="-34"/>
      <line x1="260" y1="-34" x2="330" y2="-34"/>
    </g>
    <polygon points="-244,-34 -232,-24 -244,-14 -256,-24" fill="#3EDBB0"/>
    <polygon points="244,-34 232,-24 244,-14 256,-24" fill="#3EDBB0"/>
    <text x="0" y="40" font-size="56" font-weight="bold" text-anchor="middle" letter-spacing="2" fill="#FFD95C">毎日どこかで、新ルール。</text>
  </g>

  <!-- 遠景: 街と観覧車と大富豪城 -->
  <g fill="#252F63">
    <path d="M0,1130 L0,1030 L60,1030 L60,990 L110,990 L110,1050 L190,1050 L190,1010 L250,1010 L250,1080 L330,1080 L330,1040 L400,1040 L400,1130 Z"/>
    <path d="M400,1130 L400,1060 L470,1060 L470,1020 L540,1020 L540,1090 L620,1090 L620,1050 L700,1050 L700,1130 Z"/>
    <circle cx="180" cy="1000" r="86" fill="none" stroke="#252F63" stroke-width="12"/>
    <line x1="180" y1="914" x2="180" y2="1086" stroke="#252F63" stroke-width="8"/>
    <line x1="94" y1="1000" x2="266" y2="1000" stroke="#252F63" stroke-width="8"/>
    <line x1="119" y1="939" x2="241" y2="1061" stroke="#252F63" stroke-width="8"/>
    <line x1="119" y1="1061" x2="241" y2="939" stroke="#252F63" stroke-width="8"/>
    <!-- 城 -->
    <path d="M760,1130 L760,1000 L800,1000 L800,960 L836,960 L836,1000 L890,1000 L890,930 L910,930 L910,910 L944,910 L944,930 L964,930 L964,1000 L1020,1000 L1020,960 L1056,960 L1056,1000 L1080,1000 L1080,1130 Z"/>
    <polygon points="927,910 927,856 976,878 927,896" fill="#D63B78"/>
  </g>
  <!-- 城と街の窓明かり -->
  <g fill="#FFD35A">
    <rect x="80" y="1044" width="14" height="18"/>
    <rect x="212" y="1024" width="14" height="18"/>
    <rect x="488" y="1036" width="14" height="18"/>
    <rect x="902" y="948" width="12" height="16"/>
    <rect x="938" y="948" width="12" height="16"/>
    <rect x="806" y="1014" width="12" height="16"/>
    <rect x="1032" y="1014" width="12" height="16"/>
  </g>

  <!-- すごろく街道 -->
  <path d="M940,1170 C 1040,1260 980,1370 780,1425 C 560,1485 300,1440 250,1580 C 205,1700 400,1770 1120,1760" fill="none" stroke="#F1E4C4" stroke-width="140" stroke-linecap="round"/>
  <path d="M940,1170 C 1040,1260 980,1370 780,1425 C 560,1485 300,1440 250,1580 C 205,1700 400,1770 1120,1760" fill="none" stroke="#CBB586" stroke-width="140" stroke-dasharray="10 118" stroke-dashoffset="50"/>

  <!-- 升のラベル -->
  <g font-weight="bold" fill="#6E5C3A" text-anchor="middle">
    <text x="1000" y="1318" font-size="34" transform="rotate(18 1000 1318)">秋田</text>
    <text x="245" y="1655" font-size="34" transform="rotate(-14 245 1655)">大阪</text>
    <text x="665" y="1462" font-size="44" transform="rotate(4 665 1462)">?</text>
    <text x="450" y="1490" font-size="34" transform="rotate(-4 450 1490)">革命</text>
    <text x="950" y="1742" font-size="34" transform="rotate(-3 950 1742)">8切り</text>
  </g>

  <!-- キャラ1: 旗持ちスペード -->
  <g transform="translate(285,1445)">
    <rect x="-34" y="60" width="22" height="38" rx="10" fill="#171E44"/>
    <rect x="14" y="54" width="22" height="42" rx="10" fill="#171E44" transform="rotate(14 25 75)"/>
    <line x1="46" y1="-8" x2="86" y2="-48" stroke="#171E44" stroke-width="12" stroke-linecap="round"/>
    <line x1="86" y1="-166" x2="86" y2="-44" stroke="#171E44" stroke-width="9" stroke-linecap="round"/>
    <polygon points="86,-166 192,-136 86,-108" fill="#D63B78" stroke="#171E44" stroke-width="6" stroke-linejoin="round"/>
    <use href="#sp2c" transform="translate(120,-132) scale(1.15)" fill="#FFF4DC"/>
    <use href="#char2c"/>
    <use href="#sp2c" transform="translate(0,-32)" fill="#171E44"/>
  </g>

  <!-- キャラ2: 行進するハート -->
  <g transform="translate(560,1400) rotate(-6)">
    <rect x="-40" y="54" width="22" height="42" rx="10" fill="#171E44" transform="rotate(-18 -29 75)"/>
    <rect x="18" y="54" width="22" height="42" rx="10" fill="#171E44" transform="rotate(20 29 75)"/>
    <line x1="-46" y1="-10" x2="-82" y2="-48" stroke="#171E44" stroke-width="12" stroke-linecap="round"/>
    <line x1="46" y1="-10" x2="82" y2="-48" stroke="#171E44" stroke-width="12" stroke-linecap="round"/>
    <use href="#char2c"/>
    <use href="#ht2c" transform="translate(0,-32) scale(1.1)" fill="#E14B4B"/>
  </g>

  <!-- キャラ3: ジョーカー帽の札振り -->
  <g transform="translate(800,1320) rotate(4)">
    <rect x="-34" y="60" width="22" height="38" rx="10" fill="#171E44"/>
    <rect x="12" y="60" width="22" height="38" rx="10" fill="#171E44"/>
    <line x1="44" y1="-16" x2="80" y2="-62" stroke="#171E44" stroke-width="12" stroke-linecap="round"/>
    <g transform="translate(114,-98) rotate(14)">
      <rect x="-60" y="-34" width="120" height="68" rx="10" fill="#FFCB3D" stroke="#171E44" stroke-width="6"/>
      <text x="0" y="12" font-size="30" font-weight="bold" text-anchor="middle" fill="#171E44">ぜんぶ8</text>
    </g>
    <use href="#char2c"/>
    <!-- 帽子 -->
    <g stroke="#171E44" stroke-width="5" stroke-linejoin="round">
      <path d="M-44,-64 C -52,-100 -26,-106 -18,-80 L -12,-66 Z" fill="#D63B78"/>
      <path d="M-14,-68 C -6,-110 20,-110 14,-72 L 4,-64 Z" fill="#3EDBB0"/>
      <path d="M20,-78 C 36,-102 56,-94 46,-64 L 26,-62 Z" fill="#FFCB3D"/>
    </g>
    <circle cx="-46" cy="-96" r="7" fill="#FFCB3D" stroke="#171E44" stroke-width="4"/>
    <circle cx="8" cy="-104" r="7" fill="#D63B78" stroke="#171E44" stroke-width="4"/>
    <circle cx="50" cy="-90" r="7" fill="#3EDBB0" stroke="#171E44" stroke-width="4"/>
  </g>

  <!-- キャラ4: 追いかける審判 -->
  <g transform="translate(930,1630) rotate(-4)">
    <g transform="translate(0,-210) rotate(-4)">
      <rect x="-70" y="-34" width="140" height="68" rx="20" fill="#FFFFFF" stroke="#171E44" stroke-width="5"/>
      <text x="0" y="13" font-size="34" font-weight="bold" text-anchor="middle" fill="#E14B4B">ピーッ!</text>
    </g>
    <rect x="-38" y="52" width="20" height="40" rx="9" fill="#171E44" transform="rotate(-16 -28 72)"/>
    <rect x="18" y="52" width="20" height="40" rx="9" fill="#171E44" transform="rotate(18 28 72)"/>
    <line x1="36" y1="-16" x2="72" y2="-72" stroke="#171E44" stroke-width="12" stroke-linecap="round"/>
    <rect x="54" y="-132" width="44" height="62" rx="6" fill="#FFD95C" stroke="#171E44" stroke-width="5" transform="rotate(12 76 -101)"/>
    <rect x="-40" y="-30" width="80" height="88" rx="14" fill="#FFFFFF" stroke="#171E44" stroke-width="6"/>
    <rect x="-24" y="-30" width="14" height="88" fill="#171E44"/>
    <rect x="4" y="-30" width="14" height="88" fill="#171E44"/>
    <circle cx="0" cy="-58" r="27" fill="#F0C48F" stroke="#171E44" stroke-width="5"/>
    <path d="M-27,-64 Q 0,-96 27,-64 L 27,-72 Q 0,-102 -27,-72 Z" fill="#171E44"/>
    <path d="M-17,-70 L-5,-74" stroke="#171E44" stroke-width="4" stroke-linecap="round"/>
    <path d="M5,-74 L17,-70" stroke="#171E44" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-9" cy="-60" r="3.5" fill="#171E44"/>
    <circle cx="9" cy="-60" r="3.5" fill="#171E44"/>
    <circle cx="0" cy="-44" r="7" fill="#C9CDDB" stroke="#171E44" stroke-width="3.5"/>
  </g>

  <!-- タップ導線: ネオンピル -->
  <g transform="translate(540,1745)">
    <rect x="-310" y="-50" width="620" height="100" rx="50" fill="none" stroke="#3EDBB0" stroke-width="20" opacity="0.22"/>
    <rect x="-310" y="-50" width="620" height="100" rx="50" fill="#182052" stroke="#3EDBB0" stroke-width="7"/>
    <text x="0" y="15" font-size="44" font-weight="bold" text-anchor="middle" letter-spacing="6" fill="#3EDBB0">タップして はじめる</text>
  </g>
</svg>
