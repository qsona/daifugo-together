<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) を効かせるため(E04 §3.1) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--
      CSS 変数が使えない唯一の色指定。--color-bg-brand の実値と一致していることは
      scripts/check-design-tokens.mjs が CI で照合する。
    -->
    <meta name="theme-color" content="#2B6FC2" />

    <title>みんなでつくろう 大富豪</title>
    <meta name="description" content="毎日どこかで、新ルール。" />

    <!-- 2A から派生生成した事前生成物(scripts/generate-design-images.mjs) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- OGP。画像URLはスクレイパ向けの絶対URLとし、更新時はクエリを変える。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="みんなでつくろう 大富豪" />
    <meta property="og:description" content="毎日どこかで、新ルール。" />
    <meta
      property="og:image"
      content="https://daifugo-together.fly.dev/ogp.jpg?v=20260802-1"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="みんなでつくろう 大富豪 — 毎日どこかで、新ルール。"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="みんなでつくろう 大富豪" />
    <meta name="twitter:description" content="毎日どこかで、新ルール。" />
    <meta
      name="twitter:image"
      content="https://daifugo-together.fly.dev/ogp.jpg?v=20260802-1"
    />
    <meta
      name="twitter:image:alt"
      content="みんなでつくろう 大富豪 — 毎日どこかで、新ルール。"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
