name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check rule version bumps
        run: pnpm rules:check-versions

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # デザイントークン準拠とキービジュアル SVG の自己完結性(E04 §2.3(3)・§4)
      - name: Lint design tokens and key visual
        run: pnpm lint:design

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Notify Discord when CI fails
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::notice::DISCORD_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          jq -n \
            --arg content "❌ **CI failed**\nRepository: $GITHUB_REPOSITORY\nRef: $GITHUB_REF_NAME\nActor: $GITHUB_ACTOR\n<$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" \
            '{content: $content}' \
            | curl --fail-with-body --retry 2 \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "$DISCORD_WEBHOOK_URL"
