name: Bump changed rule versions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rule-version-bump.yml
      - .node-version
      - package.json
      - pnpm-lock.yaml
      - packages/core/**
      - packages/rules/**
      - scripts/check-rule-version-bumps.mjs

permissions:
  actions: write
  contents: write

concurrency:
  group: bump-changed-rule-versions-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump changed rule versions
        id: bump
        run: |
          pnpm rules:bump-changed
          if git diff --quiet -- packages/rules/rule-versions.json packages/rules/rule-bundles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rules/rule-versions.json packages/rules/rule-bundles.json
          git commit -m "chore(rules): bump changed rule versions"
          git push origin HEAD:main

      # GITHUB_TOKENによるpushは通常のpush workflowを再発火しないため、
      # bot commitを対象にCIを明示起動する。
      - name: Verify the bot commit
        if: steps.bump.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
