name: Rule PR untrusted checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: rule-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pass for non-rule branches
        if: ${{ !startsWith(github.head_ref, 'rule/') }}
        run: echo "Not a generated rule branch."

      - name: Checkout untrusted rule head
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, and run all unit tests
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        run: pnpm typecheck && pnpm lint && pnpm test

  rule-tests:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pass for non-rule branches
        if: ${{ !startsWith(github.head_ref, 'rule/') }}
        run: echo "Not a generated rule branch."

      - name: Checkout untrusted rule head
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        run: pnpm install --frozen-lockfile

      - name: Require three tests and 70 percent line coverage
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        env:
          RULE_BRANCH: ${{ github.head_ref }}
        run: |
          RULE_DIRECTORY="${RULE_BRANCH#rule/}"
          RULE_DIRECTORY="${RULE_DIRECTORY%-a2}"
          node scripts/check-rule-tests.mjs --rule "$RULE_DIRECTORY"

  simulation:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pass for non-rule branches
        if: ${{ !startsWith(github.head_ref, 'rule/') }}
        run: echo "Not a generated rule branch."

      - name: Checkout untrusted rule head
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        run: pnpm install --frozen-lockfile

      - name: Run deterministic new-only and all-rules simulations
        if: ${{ startsWith(github.head_ref, 'rule/') }}
        env:
          RULE_BRANCH: ${{ github.head_ref }}
        run: |
          RULE_DIRECTORY="${RULE_BRANCH#rule/}"
          RULE_DIRECTORY="${RULE_DIRECTORY%-a2}"
          pnpm --filter @daifugo/sim start -- --rule "$RULE_DIRECTORY" --games 200 --seeds 5
